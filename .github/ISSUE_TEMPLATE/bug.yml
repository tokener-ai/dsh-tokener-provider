name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, personal data, and other private information before you submit this issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the steps and commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What did you observe?
      description: Include relevant output and the environment. Remove private data.
    validations:
      required: true
