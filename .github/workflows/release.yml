name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: npm install --global npm@11.21.2
      - name: Prepare release
        id: prepare
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, writeFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const valid = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(alpha|beta|rc)\.(0|[1-9]\d*))?$/
          if (!valid.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('The tag must match the package version and release format.')
          }
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {
            signal: AbortSignal.timeout(30000),
          })
          if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`)
          const metadata = await response.json()
          const versions = Object.keys(metadata.versions)
          const published = metadata.versions[version]
          const resume = Boolean(published) && Number(process.env.GITHUB_RUN_ATTEMPT) > 1
          if (published && !resume) throw new Error('This version is already published. Rerun its original workflow to recover.')
          const prerelease = version.includes('-')
          const hasStable = versions.some(value => /^\d+\.\d+\.\d+(?:\+[0-9A-Za-z.-]+)?$/.test(value))
          const tag = prerelease && hasStable ? 'beta' : 'latest'
          const tags = prerelease && !hasStable ? ['latest', 'beta'] : [tag]
          const compare = (left, right) => {
            const parse = value => value.split('+')[0].split(/-(.*)/s)
            const [leftCore, leftPre] = parse(left)
            const [rightCore, rightPre] = parse(right)
            const a = leftCore.split('.').map(BigInt)
            const b = rightCore.split('.').map(BigInt)
            for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i] ? 1 : -1
            if (leftPre === rightPre) return 0
            if (leftPre === undefined || rightPre === undefined) return leftPre === undefined ? 1 : -1
            const x = leftPre.split('.')
            const y = rightPre.split('.')
            for (let i = 0; i < Math.max(x.length, y.length); i++) {
              if (x[i] === y[i]) continue
              if (x[i] === undefined || y[i] === undefined) return x[i] === undefined ? -1 : 1
              const numericX = /^\d+$/.test(x[i])
              const numericY = /^\d+$/.test(y[i])
              if (numericX !== numericY) return numericX ? -1 : 1
              return numericX ? (BigInt(x[i]) > BigInt(y[i]) ? 1 : -1) : (x[i] > y[i] ? 1 : -1)
            }
            return 0
          }
          for (const channel of tags) {
            const current = metadata['dist-tags'][channel]
            if (current && (compare(version, current) < 0 || (!resume && compare(version, current) === 0))) {
              throw new Error(`Refusing to move ${channel} backward.`)
            }
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/release-state.json`, JSON.stringify({
            spec: `${name}@${version}`, version, tag, tags, resume,
            integrity: published?.dist?.integrity, currentTags: metadata['dist-tags'],
          }))
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nprerelease=${prerelease}\n`)
          console.log(`${resume ? 'Recover' : 'Publish'} ${name}@${version} with channels ${tags.join(', ')}`)
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack release
        run: |
          pnpm pack --out "$RUNNER_TEMP/package.tgz"
          git diff --exit-code -- lib/ cordis.patch.yml
          test -z "$(git status --porcelain --untracked-files=all -- lib/)"
          tar -tzf "$RUNNER_TEMP/package.tgz" > "$RUNNER_TEMP/package-files.txt"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const files = readFileSync(`${process.env.RUNNER_TEMP}/package-files.txt`, 'utf8').trim().split('\n')
          for (const path of ['package/index.mjs', 'package/lib/client.js', 'package/cordis.patch.yml']) {
            if (!files.includes(path)) throw new Error(`Missing package entry: ${path}`)
          }
          if (files.filter(path => /^package\/lib\/client\.locales-[a-f0-9]{12}\.js$/.test(path)).length !== 1) {
            throw new Error('The package must contain exactly one locale chunk.')
          }
          if (files.some(path => path.startsWith('package/assets/'))) throw new Error('The package contains assets/.')
          const state = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-state.json`, 'utf8'))
          if (state.resume) {
            const integrity = `sha512-${createHash('sha512').update(readFileSync(`${process.env.RUNNER_TEMP}/package.tgz`)).digest('base64')}`
            if (integrity !== state.integrity) throw new Error('Recovery refused: the published package does not match this release tarball.')
            console.log('The published package matches this release tarball. Skip publication and repair channels.')
          }
          console.log(files.join('\n'))
          NODE
      - name: Publish and complete channels
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const state = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/release-state.json`, 'utf8'))
          if (!state.resume) {
            execFileSync('npm', ['publish', `${process.env.RUNNER_TEMP}/package.tgz`, '--access', 'public', '--tag', state.tag, '--provenance', '--ignore-scripts'], { stdio: 'inherit' })
          }
          for (const channel of state.tags) {
            if ((!state.resume && channel === state.tag) || (state.resume && state.currentTags[channel] === state.version)) continue
            try {
              execFileSync('npm', ['dist-tag', 'add', state.spec, channel], { stdio: 'inherit' })
            } catch {
              console.error(`::error::The package is published, but updating ${channel} failed. Rerun the failed jobs in this workflow run to verify the tarball and repair channels.`)
              process.exit(1)
            }
          }
          console.log(`Release channels complete: ${state.tags.join(', ')}`)
          NODE
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          args=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
