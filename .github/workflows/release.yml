name: Release
on:
  push:
    tags: [v*]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate release tag, package.json, and changelog
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release.mjs validate
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - run: npm install --global npm@11.21.2
      - name: Prepare release
        run: node scripts/release.mjs prepare
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack release
        run: |
          pnpm pack --out "$RUNNER_TEMP/package.tgz"
          git diff --exit-code -- lib/ cordis.patch.yml
          test -z "$(git status --porcelain --untracked-files=all -- lib/)"
          tar -tzf "$RUNNER_TEMP/package.tgz" > "$RUNNER_TEMP/package-files.txt"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const files = readFileSync(`${process.env.RUNNER_TEMP}/package-files.txt`, 'utf8').trim().split('\n')
          for (const path of ['package/index.mjs', 'package/lib/client.js', 'package/cordis.patch.yml']) {
            if (!files.includes(path)) throw new Error(`Missing package entry: ${path}`)
          }
          if (files.filter(path => /^package\/lib\/client\.locales-[a-f0-9]{12}\.js$/.test(path)).length !== 1) {
            throw new Error('The package must contain exactly one locale chunk.')
          }
          if (files.some(path => path.startsWith('package/assets/'))) throw new Error('The package contains assets/.')
          console.log(files.join('\n'))
          NODE
      - name: Publish and complete channel
        run: node scripts/release.mjs publish
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Create GitHub Release with --prerelease or --latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs github
